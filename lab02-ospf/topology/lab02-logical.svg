<rect x="30" y="250" width="140" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="100" y="268" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">Lo1–Lo4</text>
<text x="100" y="288" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">172.16.0–3.0/24</text>
<rect x="510" y="250" width="140" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="580" y="268" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">Lo0 IPv6</text>
<text x="580" y="288" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">2001:db8:4::4/128</text>
<text x="340" y="268" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">Lower-numbered router = .1 / ::1</text>
<text x="340" y="288" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">Lo0 /32 = router ID on every router</text>
<text x="340" y="326" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">Stage 3: R2 summarizes area 1 → 172.16.0.0/22 · R3 filters 172.16.2.0/24 into area 2</text>
