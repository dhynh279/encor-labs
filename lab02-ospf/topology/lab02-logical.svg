<text x="500" y="96" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">2001:db8:34::/64</text>
<line x1="180" y1="110" x2="180" y2="176" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="340" y1="110" x2="340" y2="176" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="500" y1="110" x2="500" y2="176" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 3"/>
